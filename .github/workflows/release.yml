name: Release

# Publishes to npm when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0).
# Needs the NPM_TOKEN repository secret: an npm automation/granular token with publish rights to the package.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # npm provenance: lets npm record which workflow built the tarball

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}" >&2
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      # `prepublishOnly` builds and runs the unit tests, and the PNG export test needs the headless shell.
      - run: pnpm exec playwright install --with-deps chromium-headless-shell

      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
