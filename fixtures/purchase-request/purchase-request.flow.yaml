version: 1
title: Purchase request approval (current state, synthetic)
lanes:
  - id: requester
  - id: manager
  - id: purchasing
  - id: finance
  - id: vendor
styles:
  - legend: Confirmed by two or more people
    match: {confidence: confirmed}
    style: {border_style: solid, border_width: 2}
  - legend: One source only
    match: {confidence: single-source}
    style: {border_style: dashed, border_width: 1}
  - legend: Inferred, nobody said it directly
    match: {confidence: inferred}
    style: {border_style: dotted, font_style: italic}
  - legend: Done in the ERP
    match: {system: erp}
    style: {fill: {light: "#dae8fc", dark: "#1e3a5f"}}
  - legend: Done in a spreadsheet
    match: {system: excel}
    style: {fill: {light: "#d5e8d4", dark: "#1f4a2c"}}
  - legend: Waiting on someone
    match: {kind: wait}
    style: {fill: {light: "#fff2cc", dark: "#4a3f12"}, badge: wait}
  - legend: Open question
    match: {open_question: present}
    style: {border_color: {light: "#b85450", dark: "#f08080"}}
nodes:
